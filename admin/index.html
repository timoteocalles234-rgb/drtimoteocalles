<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tiempo de Vida — Panel</title>

  <link rel="stylesheet" href="admin.css">
</head>

<body>

  <main class="admin-container">

    <header class="admin-header">
      <div>
        <span class="eyebrow">TIEMPO DE VIDA</span>
        <h1>Panel de publicaciones</h1>
        <p>Tu espacio para crear, guardar y publicar contenido.</p>
      </div>
    </header>

    <section class="admin-actions">

      <button class="action-card">
        <span class="action-icon">＋</span>
        <strong>Nueva publicación</strong>
        <small>Crear una nueva reflexión o contenido</small>
      </button>

      <button class="action-card">
        <span class="action-icon">◷</span>
        <strong>Borradores</strong>
        <small>Contenido guardado para publicar después</small>
      </button>

      <button class="action-card">
        <span class="action-icon">✓</span>
        <strong>Publicadas</strong>
        <small>Ver todo tu contenido publicado</small>
      </button>

    </section>

    <section class="welcome-card">

      <span class="section-label">CENTRO DE CONTENIDOS</span>

      <h2>Una idea puede convertirse en una publicación.</h2>

      <p>
        Escribí una reflexión, agregá una imagen o un video,
        elegí una categoría y prepará tu contenido para Tiempo de Vida.
      </p>

      <button class="primary-button">
        ＋ Crear publicación
      </button>

    </section>

  </main>

  <script src="admin.js"></script>

</body>
</html>
